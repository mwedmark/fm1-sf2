# Builds the FM-1 firmware on a Windows runner (JieLi toolchain 2.5.3, as RUNNING.md section 1) and publishes the emulator page.
# One firmware since 2026-11-11: the default build, with the live cache (84 KB pool), which plays BFP8 and MP3 banks; it is close to the
# image's limit and to the smallest heap seen to boot, and Build.ps1 stops if it does not fit (HANDOVER_LIVE_CACHE.md).
# Runs only when started by hand (Actions > firmware > Run workflow); pushes and pull requests no longer build.
# It builds it and uploads the .fwsc package; run on main it also deploys the emulator to GitHub Pages
# (Settings > Pages > Source: GitHub Actions, once).
name: firmware

on:
  workflow_dispatch:
    inputs:
      bank_format:
        description: 'Sample format of the hosted bank (make_bank.js): sea5, sea6, bfp8, pcm8, pcm12 or pcm16'
        default: 'bfp8'
      release_tag:
        description: 'Optional: publish a GitHub pre-release with this tag (for example v0.1.0) holding the .fwsc package, the starter bank and the licence files'
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # JieLi's installer refuses to run without CodeBlocks, so only its pi32 folder is unpacked (FIRMWARE.md). Sdk/Build.ps1 then checks
      # all 22 toolchain files against sdk/manifest.json, so a wrong download fails there.
      - name: Cache the toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: jl-toolchain
          key: jieli-pi32-2.5.3

      - name: Download and unpack the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install innoextract -y --no-progress
          curl.exe -fL --retry 3 -o 2.5.3.exe https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
          $size = (Get-Item 2.5.3.exe).Length
          if ($size -ne 52860672) { throw "2.5.3.exe is $size bytes, expected 52860672" }
          innoextract --silent -d jl-extract 2.5.3.exe
          $clang = Get-ChildItem jl-extract -Recurse -Filter clang.exe | Where-Object { $_.Directory.Name -eq 'bin' -and $_.Directory.Parent.Name -eq 'pi32' } | Select-Object -First 1
          if (!$clang) { throw 'No pi32/bin/clang.exe in the installer' }
          New-Item -ItemType Directory -Force jl-toolchain | Out-Null
          Move-Item $clang.Directory.Parent.FullName jl-toolchain/pi32
          Remove-Item 2.5.3.exe, jl-extract -Recurse -Force

      - name: Build the firmware
        shell: powershell
        working-directory: fm1_open
        run: |
          $env:FM1_PI32_TOOLCHAIN = Join-Path $env:GITHUB_WORKSPACE 'jl-toolchain\pi32'
          ./sdk/Build.ps1 -FirmwareOnly -Toolchain $env:FM1_PI32_TOOLCHAIN 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\build.log"
          if (!$?) { throw 'The build failed.' }

      - name: Sizes
        if: always()
        shell: pwsh
        run: |
          "### firmware" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path build.log) {
            $lines = Select-String -Path build.log -Pattern 'app image|fits|does not fit|runtime_heap|heap' | ForEach-Object { $_.Line }
            '```' + "`n" + ($lines -join "`n") + "`n" + '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          $report = 'fm1_open/build/dx7/firmware-report.json'
          if (Test-Path $report) { '```json' + "`n" + (Get-Content $report -Raw) + "`n" + '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append }

      - name: Collect the package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item fm1_open/build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc out/sf2player.fwsc
          Copy-Item fm1_open/build/dx7/firmware-report.json out/firmware-report.json
          Copy-Item fm1_open/build/dx7/build-identity.json out/build-identity.json   # the install page's manifest needs the build id
          Copy-Item build.log out/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/
          if-no-files-found: error

  # The hosted bank is the committed banks/default.fm1b (converted from 1mgm.sf2, which stays on the maintainer's computer and is not in the repo).
  # Optionally a SoundFont is fetched from the repository secret SF2_URL (an https address),
  # converted with make_bank.js and stored as the artifact "bank" (default.fm1b), which the site then hosts and selects at the start.
  # Without the secret this job does nothing and the site keeps whatever banks/ holds (or the sine test bank).
  bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Convert the SoundFont
        env:
          SF2_URL: ${{ secrets.SF2_URL }}
          FORMAT: ${{ inputs.bank_format || vars.BANK_FORMAT || 'bfp8' }}
        run: |
          if [ -f soundfonts/1mgm.sf2 ]; then cp soundfonts/1mgm.sf2 font.sf2
          elif [ -n "$SF2_URL" ]; then curl -fsSL --retry 3 -o font.sf2 "$SF2_URL"
          else echo "No soundfonts/1mgm.sf2 and no SF2_URL secret: no bank is made." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          mkdir -p out
          node make_bank.js "$FORMAT" 32000 font.sf2 out/default.fm1b | tee bank.log
          echo "### bank ($FORMAT, 32 kHz)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat bank.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          size=$(stat -c %s out/default.fm1b)
          if [ "$size" -gt 1048576 ]; then echo "The bank is $size bytes: the emulator takes 1 MB at most." >&2; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bank
          path: out/default.fm1b
          if-no-files-found: ignore

  # The emulator (github.com/joakimeriksson/fm1-emu, MIT) with this build and a small test bank. Pages is the same origin for the
  # page, the firmware and the bank, so the emulator can fetch them (RUNNING.md section 4).
  site:
    needs: [build, bank]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      - name: The converted bank (when the bank job made one)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bank
          path: banks
      - name: JZZ.js (pinned in .github/site/package-lock.json)
        run: npm ci --ignore-scripts --prefix .github/site
      - name: Make the site
        run: node .github/make_site.js site fw/sf2player.fwsc "${GITHUB_SHA}" fw/build-identity.json
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-site
          path: site/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site/

  deploy:
    needs: site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A pre-release (the Firmware Hub marks 0.x, alpha, beta and rc as beta) with the package, the starter bank, the licence and the third-party
  # notices. Only when "Run workflow" is given a release_tag; the tag is made on the commit that was built.
  release:
    needs: build
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          cp LICENSE fm1_open/THIRD_PARTY.md fw/
          cp banks/default.fm1b fw/gm_32k_bfp8.fm1b
          cat > notes.md <<'NOTES'
          Firmware package for the M-VAVE FM-1 (install it with https://mwedmark.github.io/fm1-sf2/install.html): the SF2 player with the live cache, which plays BFP8 banks and MP3-packed banks. Beta: still being tested on the device.

          `gm_32k_bfp8.fm1b`: a General MIDI bank (BFP8, 32 kHz, 454 KB) to get started with; install.html puts it on the FM-1 with the firmware. Its sounds come from a General MIDI SoundFont whose header names E-mu Systems (1993) as the copyright holder; it is included for convenience, and you can replace it with a bank of your own made with the converter.

          Licence: GPL-3.0 with the FM1 SDK linking exception (`LICENSE`). The proprietary engine and the other third-party components keep their own terms (`THIRD_PARTY.md`); the engine may be redistributed in binary form for M-VAVE FM-1 devices only. The corresponding source is this repository at the tag of this release.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "$TAG" --notes-file notes.md \
            fw/sf2player.fwsc fw/gm_32k_bfp8.fm1b fw/LICENSE fw/THIRD_PARTY.md
